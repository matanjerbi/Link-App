<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>צ'אט</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#0f1115;color:#eef0f3}
  .hidden{display:none!important}
  /* join */
  #join{max-width:440px;margin:0 auto;padding:40px 18px}
  h1{font-size:28px;margin:0 0 6px}
  .sub{color:#9aa3af;margin:0 0 24px;font-size:15px;line-height:1.5}
  .card{background:#181b22;border:1px solid #262b35;border-radius:16px;padding:18px}
  label{display:block;font-size:13px;color:#9aa3af;margin-bottom:6px}
  input{width:100%;padding:14px;border-radius:12px;border:1px solid #2f3542;background:#0f1115;color:#fff;font-size:17px;outline:none}
  input:focus{border-color:#6d8bff}
  #code{text-align:center;letter-spacing:6px;font-size:24px;font-weight:700;text-transform:uppercase}
  button{padding:14px;border:0;border-radius:12px;background:#6d8bff;color:#fff;font-size:17px;font-weight:600;cursor:pointer}
  button.ghost{background:transparent;border:1px solid #2f3542;color:#cdd3dc}
  .row{display:flex;gap:8px;margin-top:10px}
  .row button{flex:1}
  .err{color:#ff8a8a;font-size:14px;margin-top:8px;min-height:1em}
  /* chat */
  #chat{display:flex;flex-direction:column;height:100dvh;max-width:640px;margin:0 auto}
  header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid #262b35;background:#13161c}
  header .code{font-weight:800;letter-spacing:3px;font-size:18px}
  header .st{font-size:12px;color:#9aa3af;flex:1}
  header button{padding:8px 12px;font-size:14px}
  #msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:6px}
  .b{max-width:80%;padding:9px 12px;border-radius:16px;line-height:1.4;font-size:16px;white-space:pre-wrap;word-break:break-word}
  .b.me{align-self:flex-start;background:#6d8bff;color:#fff;border-bottom-right-radius:4px}
  .b.them{align-self:flex-end;background:#232834;border-bottom-left-radius:4px}
  .b a{color:inherit;text-decoration:underline}
  .b.them a{color:#9db8ff}
  .t{font-size:11px;opacity:.65;margin-top:3px}
  .empty{color:#6b7280;text-align:center;margin-top:30px;font-size:14px;line-height:1.6}
  form{display:flex;gap:8px;padding:10px 12px;border-top:1px solid #262b35;background:#13161c}
  form input{flex:1;padding:12px 14px;font-size:16px;border-radius:22px}
  form button{border-radius:22px;padding:0 18px}
</style>
</head>
<body>
<div id="join">
  <h1>💬 צ'אט</h1>
  <p class="sub">צרו חדר ושלחו את הקישור לצד השני. מי שנכנס עם אותו קוד נמצא באותה שיחה. אין הרשמה, והכל נמחק אחרי 24 שעות בלי פעילות.</p>
  <div class="card">
    <label for="code">קוד חדר</label>
    <input id="code" maxlength="8" autocomplete="off" placeholder="ABCDE">
    <div class="row">
      <button id="joinBtn">כניסה</button>
      <button id="newBtn" class="ghost">חדר חדש</button>
    </div>
    <div id="err1" class="err"></div>
  </div>
</div>

<div id="chat" class="hidden">
  <header>
    <span class="code" id="roomCode"></span>
    <span class="st" id="st"></span>
    <button id="share" class="ghost">שתף קישור</button>
    <button id="leave" class="ghost">יציאה</button>
  </header>
  <div id="msgs"></div>
  <form id="f" autocomplete="off">
    <input id="txt" placeholder="הודעה או קישור…" maxlength="2000" enterkeyhint="send">
    <button id="sendBtn" type="submit">שלח</button>
  </form>
</div>

<script>
const $ = id => document.getElementById(id);
let room = null, timer = null, last = 0, all = [], busy = false;

function randCode(){
  const a = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s = ""; for (let i=0;i<5;i++) s += a[Math.floor(Math.random()*a.length)];
  return s;
}
function clean(c){ return (c||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,8); }
function myId(){
  try { let v = localStorage.getItem("ld_me"); if (!v) { v = Math.random().toString(36).slice(2); localStorage.setItem("ld_me", v); } return v; }
  catch(e){ return window._me || (window._me = Math.random().toString(36).slice(2)); }
}
function hhmm(ts){ const d = new Date(ts); return d.getHours().toString().padStart(2,"0")+":"+d.getMinutes().toString().padStart(2,"0"); }

function linkify(el, text){
  const re = /((?:https?:\/\/|www\.)[^\s<]+)/gi; let i = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > i) el.appendChild(document.createTextNode(text.slice(i, m.index)));
    let url = m[0].replace(/[.,!?)\]]+$/, "");
    const a = document.createElement("a");
    a.href = /^www\./i.test(url) ? "https://" + url : url;
    a.target = "_blank"; a.rel = "noopener noreferrer"; a.textContent = url;
    el.appendChild(a); i = m.index + url.length; re.lastIndex = i;
  }
  if (i < text.length) el.appendChild(document.createTextNode(text.slice(i)));
}

function enter(code){
  code = clean(code);
  if (code.length < 3) { $("err1").textContent = "קוד של 3–8 תווים"; return; }
  room = code; last = 0; all = [];
  history.replaceState(null, "", "#" + code);
  $("roomCode").textContent = code;
  $("join").classList.add("hidden"); $("chat").classList.remove("hidden");
  $("msgs").innerHTML = '<div class="empty">החדר פתוח.<br>לחצו "שתף קישור" ושלחו לצד השני.</div>';
  $("st").textContent = "";
  poll(); clearInterval(timer); timer = setInterval(poll, 1500);
  $("txt").focus();
}

async function poll(){
  if (!room || busy) return; busy = true;
  try {
    const r = await fetch("/api/r/" + room + "?after=" + last, { cache: "no-store" });
    const j = await r.json();
    $("st").textContent = "";
    if (j.msgs && j.msgs.length) { addMsgs(j.msgs); }
  } catch(e) { $("st").textContent = "אין חיבור…"; }
  busy = false;
}

function addMsgs(list){
  const box = $("msgs");
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
  if (!all.length) box.innerHTML = "";
  const me = myId();
  for (const m of list) {
    if (m.at <= last) continue;
    last = m.at; all.push(m);
    const b = document.createElement("div");
    b.className = "b " + (m.by === me ? "me" : "them");
    linkify(b, m.text);
    const t = document.createElement("div"); t.className = "t"; t.textContent = hhmm(m.at);
    b.appendChild(t); box.appendChild(b);
  }
  if (nearBottom || list.some(m => m.by === me)) box.scrollTop = box.scrollHeight;
}

$("f").addEventListener("submit", async e => {
  e.preventDefault();
  const text = $("txt").value.trim(); if (!text) return;
  $("txt").value = ""; $("txt").focus();
  try {
    const r = await fetch("/api/r/" + room, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ text, by: myId() }) });
    if (!r.ok) throw 0;
    poll();
  } catch(e) { $("txt").value = text; $("st").textContent = "השליחה נכשלה, נסו שוב"; }
});

$("joinBtn").onclick = () => enter($("code").value);
$("newBtn").onclick = () => enter(randCode());
$("code").addEventListener("keydown", e => { if (e.key === "Enter") enter($("code").value); });
$("share").onclick = async () => {
  const url = location.origin + "/#" + room;
  try { if (navigator.share) { await navigator.share({ title: "בוא/י לצ'אט", url }); return; } } catch(e){ if (e && e.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(url); $("share").textContent = "הועתק ✓"; }
  catch(e){ $("st").textContent = url; }
  setTimeout(() => $("share").textContent = "שתף קישור", 1800);
};
$("leave").onclick = () => {
  clearInterval(timer); room = null;
  history.replaceState(null, "", location.pathname);
  $("chat").classList.add("hidden"); $("join").classList.remove("hidden"); $("code").value = "";
};
document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
window.addEventListener("hashchange", () => { const c = clean(location.hash.slice(1)); if (c && c !== room) enter(c); });
if (location.hash.length > 1) enter(location.hash.slice(1));
</script>
</body>
</html>
